name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .
        # obsidianmd-parser requires Python >=3.12 — keep matrix in sync

      - name: Verify entry point
        run: |
          wikilint --help
          wikilint --version

      - name: Control battery
        run: bash tests/control_battery.sh